# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.7.10"
  am_version: "1.15"
  posix_prefix: ${{ "m2-" if win else "" }}

package:
  name: chktex
  version: ${{ version }}

source:
  url:
    # https://github.com/conda-forge/chktex-feedstock/pull/8
    ## 200 locally, 502 in CI
    - https://download.savannah.gnu.org/releases/chktex/chktex-${{ version }}.tar.gz
    - https://www.mirrorservice.org/sites/download.savannah.gnu.org/releases/chktex/chktex-${{ version }}.tar.gz
  sha256: cea81a1cde2f151db2b5d2adf2271becfd3c0c1f40eca5cf45b52beeb4a636f9
  patches:
    - if: win
      then: 0001-relocatable-windows-resource.patch
    - if: target_platform == "win-arm64"
      then: 0002-msvc-crt-headers.patch

build:
  number: 1
  script:
    file: build-chktex
  dynamic_linking:
    missing_dso_allowlist:
      - if: osx
        then: /usr/lib/libncurses.5.4.dylib

requirements:
  build:
    - ${{ posix_prefix }}autoconf
    - ${{ posix_prefix }}libtool
    - ${{ posix_prefix }}make
    - ${{ posix_prefix }}patch
    - ${{ posix_prefix }}sed
    - pkg-config
    - if: unix
      then:
        - ${{ compiler("c") }}
        - ${{ compiler("cxx") }}
        - ${{ stdlib("c") }}
        - automake
        - gettext
        - gnuconfig
      else:
        - if: target_platform == "win-arm64"
          then:
            - ${{ compiler("c") }}
            - ${{ stdlib("c") }}
            - clang
            - lld
          else:
            - ${{ compiler("m2w64_c") }}
            - ${{ compiler("m2w64_cxx") }}
            - ${{ stdlib("m2w64_c") }}
        - m2-automake${{ am_version }}
        - m2-base
  host:
    - if: target_platform == "win-arm64"
      then: getopt-win32
    - ${{ posix_prefix }}ncurses
    - ${{ posix_prefix }}perl
  run:
    # deweb and chkweb are perl scripts, so perl is needed at run time. On
    # unix this has been satisfied by the system perl their shebang points
    # at; Windows has none, so the interpreter must ship with the package.
    - if: win
      then: m2-perl

tests:
  - files:
      recipe:
        - test_behavior.pl
    requirements:
      run:
        - ${{ posix_prefix }}perl
    script:
      - perl test_behavior.pl ${{ target_platform }}
  - script:
      - chktex --version
      - deweb --version
      - chkweb --version

about:
  license: GPL-2.0-or-later
  license_file: COPYING
  summary: LaTeX semantic checker
  description: |
    This program has been written in frustration because some constructs in
    LaTeX are sometimes non-intuitive, and easy to forget. It is _not_ a
    replacement for the built-in checker in LaTeX; however it catches some
    typographic errors LaTeX oversees. In other words, it is Lint for LaTeX.
    Filters are also provided for checking the LaTeX parts of CWEB documents.
  homepage: https://www.nongnu.org/chktex
  repository: https://savannah.nongnu.org/projects/chktex

extra:
  recipe-maintainers:
    - bollwyvl
